# Tests du cœur, des images, du GUI et du NAT intégré (sans libslirp/GLib).
# Les tests réseau restent hors ligne : sockets locales et résolveurs simulés.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Appelé aussi par release.yml sur un tag : le job `publish` en dépend, aucune
  # release ne part sans ces tests (un tag ne déclenche pas le `push` ci-dessus).
  workflow_call:

permissions:
  contents: read

# github.workflow nomme l'APPELANT quand ce fichier est appelé : le groupe reste distinct
# de celui des Tests lancés seuls, qui sinon s'annuleraient l'un l'autre.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NAT intégré : le même code est livré sur toutes les cibles de bureau.
  nat:
    name: NAT intégré (NE2000, IPv4/IPv6, TCP/UDP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          # Le miroir Azure a consommé les 30 min du job le 2026-11-05.
          # Conserver la sélection de suites du runner, changer seulement le miroir.
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' "$source"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 cmake g++ ffmpeg
      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNEOST_WITH_NET=ON
      - name: Compiler (headless et tests NAT inclus)
        run: cmake --build build -j"$(nproc)" --target neost-headless neost-selftest neost-stx-test neost-fuzz-disk
      - name: Palier fast (protocoles NAT, sockets locales et NE2000)
        run: python3 tools/run_all.py --tier fast

  net-off:
    name: Réseau hôte désactivé (NEOST_WITH_NET=OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Configurer et compiler sans sockets hôte
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNEOST_WITH_NET=OFF
          cmake --build build -j"$(nproc)" --target neost-headless
      - name: NAT refusé explicitement
        run: |
          if ./build/neost-headless roms/etos192us.img --ethernec --nat --frames 1 > nat-off.log 2>&1; then
            cat nat-off.log
            exit 1
          fi
          grep -F 'NEOST_WITH_NET=OFF' nat-off.log

  # -------------------------------------------------------------------- pixel --
  pixel:
    name: Palier PIXEL (--tier full)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances
        run: |
          # Dépôt Microsoft de l'image runner : inutile ici, et ses 403 font échouer l'update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libglfw3-dev libgl1-mesa-dev python3-pil ffmpeg
          # ⚠ ffmpeg est REQUIS, pas optionnel : compare_screenshot.py s'en sert pour
          # décoder les références PNG (tous les étalons ref_kind=hatari). Sans lui le
          # job échoue en « vacuité NON VÉRIFIABLE … illisible » sur 9 étalons, alors
          # que les références .ppm passent — panne asymétrique et trompeuse.
          ffmpeg -version | head -1

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build -j"$(nproc)" --target neost-headless neost-selftest neost-stx-test neost-fuzz-disk

      # LA raison d'être de ce job (chantier A1, cf. TODO.md § Dette d'architecture).
      # `--tier fast` ne compare AUCUN pixel : il valide des parseurs et des verdicts.
      # Tant que le palier pixel n'a tourné QUE dans release.yml, une régression de
      # RENDU partait sur `main` et n'était vue qu'à la publication suivante.
      # Deux cas MESURÉS que le fast ne voit pas :
      #   · NEOST_SYNC_DISPATCH=1 casse `nocooper_greetings` à 98,97 % (113633/114816) ;
      #   · le chantier BL3/BL4 (base de temps du blitter) serait passé au vert.
      # Il tourne en ~1-2 min de plus que le fast : le coût est sans commune mesure
      # avec celui d'une régression de rendu découverte des semaines plus tard.
      - name: Palier full (étalons PIXEL — le SEUL palier qui compare des images)
        run: python3 tools/run_all.py --tier full

      # Filet de dernier recours : si les ROM Atari propriétaires quittent le dépôt,
      # `run_etalons.py` RECENSE les étalons non exécutés au lieu d'échouer
      # (rom_is_free()). Vert avec une couverture amputée ressemblerait à vert tout
      # court — on rend donc le décompte VISIBLE dans le journal du job.
      - name: Contrôle de provenance des références
        run: python3 tools/run_etalons.py --verify-refs

      - name: Capture des écarts en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etalons-diff
          path: tests/out/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------- gui --
  # Bancs RTL (fx68k, stBlitter, GSTMCU) : SKIP sur tous les autres jobs, faute de Verilator.
  # La version est figée et compilée une fois, puis gardée en cache : celle d'Ubuntu 24.04 est trop ancienne.
  rtl:
    name: Bancs RTL (Verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERILATOR_VERSION: v5.054
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make autoconf flex bison help2man perl libfl-dev zlib1g-dev libglfw3-dev libgl1-mesa-dev

      - name: Cache Verilator
        id: verilator-cache
        uses: actions/cache@v4
        with:
          path: ~/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-ubuntu-24.04

      - name: Compiler Verilator
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VERILATOR_VERSION" https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: RTL aux épingles
        run: |
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
          bash tools/setup_silicon_refs.sh --rtl-only

      - name: Compiler NeoST
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target neost-headless neost-moira-bare neost-blitter-bare neost-glue-bare

      - name: Bancs
        run: |
          python3 tools/run_gstmcu_bench.py
          python3 tools/run_fx68k_bench.py
          python3 tools/run_stcpu_bench.py
          python3 tools/run_stcpu_raster.py
          python3 tools/run_glue_sweep.py
          python3 tools/run_stblitter_bench.py

  gui:
    name: GUI sous xvfb (boot réel + capture)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # ⚠ submodules: le GUI compile Dear ImGui depuis extern/imgui — les autres jobs
      # n'en ont pas besoin et font un checkout nu.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Dépendances
        run: |
          # Dépôt Microsoft de l'image runner : inutile ici, et ses 403 font échouer l'update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libglfw3-dev libgl1-mesa-dev libgl1-mesa-dri xvfb

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # La cible `neost` (GUI) n'était compilée par AUCUN job de tests — release.yml
      # la bâtit, mais sans jamais l'EXÉCUTER. Chantier A8, dernière marche.
      - name: Compiler (GUI + headless)
        run: cmake --build build -j"$(nproc)" --target neost neost-headless

      # LA raison d'être de ce job : le GUI n'avait jamais TOURNÉ en CI. Grâce à
      # --run-frames/--shot (2026-08-26), il boote EmuTOS, émule 400 trames, capture
      # le framebuffer ST et sort seul. xvfb fournit l'écran ; le GL logiciel de Mesa
      # (llvmpipe) fait le rendu. Sans neost.cfg sur le runner, le GUI part sur ses
      # défauts (st / 512k / couleur) — le headless est aligné explicitement dessus.
      - name: Boot GUI sous xvfb (400 trames, capture)
        run: |
          xvfb-run -a ./build/neost --run-frames 400 --shot /tmp/gui.ppm roms/etos192fr.img
          test -s /tmp/gui.ppm

      - name: La capture n'est pas vide (bureau GEM attendu)
        run: |
          python3 - <<'EOF'
          colors = set()
          with open('/tmp/gui.ppm', 'rb') as f:
              assert f.readline().strip() == b'P6'
              w, h = map(int, f.readline().split())
              f.readline()
              d = f.read()
          for i in range(0, w * h * 3, 3):
              colors.add(d[i:i+3])
          print(f'{w}x{h}, {len(colors)} couleurs')
          # Le bureau EmuTOS en couleur fait EXACTEMENT 3 couleurs (fond vert, traits
          # noirs, fenêtre blanche) — mesuré au premier run de ce job, qui échouait sur
          # un seuil >= 4 posé de tête. 1-2 couleurs = écran figé/noir, c'est-à-dire un
          # GUI qui tourne sans émuler — le bug que ce garde-fou attrape. Le vrai juge
          # est de toute façon l'étape suivante (bit-exact vs headless).
          assert len(colors) >= 3, f'capture quasi uniforme ({len(colors)} couleurs)'
          EOF

      # Assertion FORTE : le framebuffer du GUI doit être BIT-IDENTIQUE à celui du
      # headless au même point (même cœur, même Shifter, mêmes défauts de config).
      # Si cette comparaison casse, la boucle GUI n'émule pas comme le headless —
      # exactement la classe de divergence qu'aucun palier ne voyait.
      - name: Le GUI émule comme le headless (bit-exact, 400 trames)
        run: |
          # ⚠ --disk ALIGNÉ : sans positional, le GUI monte disks/diskA.st PAR DÉFAUT
          # (defDisk dans main.cpp) — sans ce même disque, le headless boote une
          # timeline différente et la comparaison bit-exacte meurt sur un faux écart.
          ./build/neost-headless roms/etos192fr.img --machine st --mem 512k \
            --disk disks/diskA.st --frames 400 --screenshot /tmp/cli.ppm
          cmp /tmp/gui.ppm /tmp/cli.ppm
          echo "GUI == headless (bit-exact)"

      - name: Capture en artefact en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-shot
          path: /tmp/*.ppm
          if-no-files-found: ignore

  # -------------------------------------------------------------- sanitizers --
  sanitizers:
    name: Debug + ASan/UBSan (palier fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances
        run: |
          # Dépôt Microsoft de l'image runner : inutile ici, et ses 403 font échouer l'update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -o Acquire::Retries=3
          # ffmpeg : requis depuis que trace_odd est une référence ORACLE (PNG, 2026-08-29)
          # — compare_screenshot.py s'en sert pour lire les PNG ; sans lui le palier fast
          # de CE job échouait pendant que le job pixel, qui l'installe, restait vert.
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libglfw3-dev libgl1-mesa-dev ffmpeg

      - name: Configurer (Debug — les assert() sont ACTIFS ici, et nulle part ailleurs)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Compiler
        run: cmake --build build -j"$(nproc)" --target neost-headless neost-selftest neost-stx-test neost-fuzz-disk

      # Le palier fast n'exécute quasiment PAS de code invité réel : il valide des
      # parseurs et des verdicts. Une démo de 300 trames, elle, martèle Shifter,
      # Blitter, MFP et le cœur 68000 — et coûte 2 s sous ASan. Sans ça, les
      # sanitizers de la CI ne voyaient jamais l'émulateur travailler.
      - name: Démos réelles sous sanitizers (code invité, pas des parseurs)
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for d in nocooper.msa cuddly_demos.msa closure.msa; do
            echo "--- $d"
            # etos192fr et pas un TOS Atari : la purge copyright retire roms/tos* du
            # dépôt ; les trois démos bootent sous EmuTOS (vérifié, exit 0 sur 300 trames).
            ./build/neost-headless roms/etos192fr.img --disk "disks/etalons/$d" --frames 300
          done

      - name: Palier fast sous sanitizers
        env:
          # halt_on_error : un dépassement doit FAIRE ÉCHOUER le job, pas se noyer
          # dans la sortie. detect_leaks=0 : les objets de durée de vie processus
          # (ma_device, contexte Moira) sont libérés par l'OS et ne sont pas des
          # fuites utiles — le sujet ici est la corruption mémoire.
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tools/run_all.py --tier fast
