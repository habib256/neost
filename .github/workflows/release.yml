# =============================================================================
#  Artefacts NeoST — 8 paquets, calqués sur la release POM1 (jobs natifs,
#  vérifications structurelles, smoke-launch headless, publication sur tag) :
#
#    1. NeoST-<ver>-x86_64.AppImage             (Linux Intel/AMD, image bionic
#                                                gelée → plancher glibc 2.27)
#    2. NeoST-<ver>-aarch64.AppImage            (Linux ARM64 générique)
#    3. NeoST-<ver>-macOS-universal2.dmg        (Universal 2 arm64+x86_64,
#                                                GLFW statique)
#    4. NeoST-<ver>-raspberry-aarch64.AppImage  (Raspberry Pi GÉNÉRIQUE Pi 3→Pi 5,
#                                                aucun -mcpu ; plancher glibc
#                                                bookworm 2.36 = Pi OS)
#    5. NeoST-<ver>-pi400-aarch64.AppImage      (Pi 4 / Pi 400 : -mcpu=cortex-a72,
#                                                NE démarre pas sur un cœur plus
#                                                ancien — c'est le prix du gain)
#    6. NeoST-<ver>-windows-x86_64.zip          (Windows 10/11 x64, MinGW-w64,
#                                                tout statique — aucune DLL à
#                                                installer, non signé)
#    7. NeoST-<ver>-web-wasm.zip                (WebAssembly, contenu libre)
#    8. NeoST-<ver>-android-arm64-debug.apk     (Android 5.0+ arm64-v8a, signé
#                                                clé de DEBUG → installable tel
#                                                quel ; EmuTOS + diskA seulement)
#
#
#  Chaque job SMOKE-LANCE le paquet via neost-headless (déterministe, sans
#  affichage) — tools/smoke_package.sh, 5 phases : --version, boot EmuTOS 500
#  trames (le bureau apparaît vers la trame ~400) + capture PPM non uniforme,
#  montage de la DISQUETTE LIVRÉE (elle avait été écrasée et livrée illisible
#  pendant des mois, issue #38) et montage d'un dossier hôte en HD GEMDOS par
#  chemin ABSOLU (forme native de l'hôte : le lecteur C: était mort sur tous les
#  paquets Windows, issue #37). Ces deux dernières phases sont la leçon des deux
#  seuls défauts jamais signalés sur un paquet publié : le binaire démarrait, les
#  DONNÉES et les MONTAGES n'étaient testés par personne.
#  La 5e phase (2026-09-01, chantier A12) ferme un trou de la même famille : les
#  quatre premières ÉCRIVENT dans le paquet (captures, journaux, dossier GEMDOS),
#  donc elles exigent un dossier EXTRAIT — jamais le support que l'utilisateur
#  lance vraiment, .dmg monté ou AppImage, tous deux en LECTURE SEULE. C'est par
#  là qu'est passé le paquet qui n'enregistrait aucun réglage (5 paquets sur 8).
#  La phase retire le droit d'écriture, relance le binaire depuis un répertoire
#  extérieur et vérifie qu'il démarre SANS rien déposer dans son paquet.
#  Les paquets embarquent la liste autorisée (packaging/stage_free_data.sh :
#  EmuTOS GPL + tos102uk/tos162uk des profils 520 ST / 1040 STE + diskA.st) —
#  jamais les autres TOS ni les jeux du dépôt.
#
#  Déclencheurs : chaque push/PR vérifie que la génération des 8 artefacts
#  passe ; un tag de version (v1.0.0 ou 1.0.0) les attache en plus à la Release.
#
#  GitHub Pages : la démo EST le dossier wasm/ commité (Pages sert la branche,
#  build_type=legacy, main/(root)). Sur push de main, le job `wasm` RECOMMITE ce
#  dossier après l'avoir reconstruit : le bundle reste dans l'arbre de travail et
#  suit les sources sans intervention. C'est ce qui remplace la garde de fraîcheur
#  d'avant, qui se contentait de rendre la CI rouge (cf. DEV.md § WebAssembly).
#
#  Planchers glibc : x86_64 = 2.27 (image bionic gelée neost-bionic-builder,
#  dérivée du pom1-bionic-builder — gcc-11 car Moira exige C++20) ;
#  Raspberry et pi400 = 2.36 (conteneur debian:bookworm = Pi OS) ; arm64
#  générique = l'image du runner (2.39), suffisant pour les distros ARM récentes.
# =============================================================================
name: Artefacts (release)

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*'        # v1.0.0
      - '[0-9]*'         # 1.0.0 (convention tag nu, comme POM1)
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # le job publish attache les paquets à la Release

concurrency:
  group: artefacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------- normalisation version --
  # Source unique du numéro de version : tag sans « v » de tête (1.0.0 quel
  # que soit le format poussé), sinon dev-<sha court> pour les runs de vérif.
  version:
    runs-on: ubuntu-latest
    outputs:
      neost_version: ${{ steps.v.outputs.neost_version }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$REF_TYPE" = "tag" ]; then
              echo "neost_version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
              echo "neost_version=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------- Linux x86_64 (image bionic) --
  # Bâti DANS l'image gelée neost-bionic-builder (glibc 2.27 → tourne de
  # Mint 19.x à aujourd'hui), dérivée du pom1-bionic-builder — même squelette,
  # mais gcc-11 car Moira exige C++20 (le g++-9 de l'image POM1 ne suffit pas).
  # Si l'image manque : lancer d'abord le workflow « Build bionic builder
  # image ». `docker run` et non `container:` — les actions node exigent une
  # glibc >= 2.28 et ne tournent pas dans bionic.
  linux-bionic:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read          # tirer l'image builder depuis GHCR
    env:
      # ÉPINGLÉE PAR DIGEST pour la reproductibilité — cette toolchain gelée
      # précise, pas un tag mouvant. Après un rebuild via build-bionic-image.yml,
      # ré-épingler le digest qu'il imprime (le tag :bionic continue de bouger).
      BUILDER_IMAGE: ghcr.io/habib256/neost-bionic-builder@sha256:580175cf86701ee962e92a7bac1a95c62822be4a0bf6fc52d972730bfba318ad
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Log in to GHCR (tirer l'image builder)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + AppImage dans l'image bionic gelée
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: |
          IMAGE="$(echo "$BUILDER_IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker pull "$IMAGE"
          docker run --rm -v "$PWD":/work -w /work -e NEOST_VERSION \
            "$IMAGE" bash /work/packaging/linux/build_in_bionic.sh

      # Même garde que le job arm64 : sans elle, le paquet x86_64 — celui que la
      # plupart des utilisateurs téléchargent — partait en release sans qu'aucun étalon
      # n'ait tourné. Le binaire bâti dans le conteneur bionic (glibc 2.27) s'exécute
      # sans problème sur le runner hôte, la glibc étant compatible ascendante.
      - name: Suite de validation (palier full — inclut les étalons PIXEL)
        run: |
          # ⚠ `apt-get update` D'ABORD. L'index apt de l'image runner est figé à sa date
          # de construction : quand Ubuntu publie une révision d'un paquet, l'ancienne
          # SORT du pool et l'index périmé la demande encore — 404, et l'étape entière
          # échoue avant d'avoir rien construit. Mesuré le 2026-09-02 sur la 0.6.1, DEUX
          # fois de suite (donc pas un aléa) : `libssh-gcrypt-4 0.10.6-2ubuntu0.4`,
          # dépendance transitive de ffmpeg, ignorée par les trois miroirs puis 404. Le
          # job `publish` dépendant des huit paquets, la release n'était pas publiée.
          # C'était le SEUL `apt-get install` du dépôt sans update — les six autres
          # (tests.yml ×4, oracle.yml, et le job linux-arm64 juste en dessous) l'ont
          # toujours eu.
          # Dépôt Microsoft de l'image runner : inutile ici, et ses 403 font échouer l'update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -qq -o Acquire::Retries=3
          # ffmpeg : cf. le job arm64 — compare_screenshot.py décode les références
          # .png via ffmpeg, sans quoi les 5 étalons à référence PNG échouent.
          sudo apt-get install -y --no-install-recommends ffmpeg
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          # neost-selftest AUSSI : le palier « fast » l'exécute (logique pure —
          # chemins hôte, neost.cfg). Ne bâtir que le headless faisait échouer
          # la suite sur un binaire absent.
          cmake --build build -j"$(nproc)" --target neost-headless neost-selftest neost-stx-test neost-fuzz-disk
          python3 tools/run_all.py --tier full

      - name: Vérifier l'AppImage (ET_EXEC, magic, glibc <= 2.27, GLFW, contenu libre)
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage)
          # Runtime ELF ET_EXEC obligatoire (pas le static-pie ET_DYN) sinon
          # AppImageLauncher rejette le paquet en « type -1 » — la régression
          # que l'appimagetool AppImageKit gelé dans l'image corrige.
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type/ {print $3; exit}')
          echo "Type ELF du runtime : $TYPE"
          test "$TYPE" = "EXEC" || { echo "ERREUR : runtime $TYPE ≠ EXEC"; exit 1; }
          # Magic AI\x02 à l'offset 8 = AppImage type 2 valide.
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" || { echo "ERREUR : magic AppImage $MAGIC ≠ 414902"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/neost
          readelf -h "$BIN" | grep -q 'X86-64' || { echo "ERREUR : pas un binaire x86_64"; exit 1; }
          # Plancher glibc : symbole GLIBC_x.y le plus haut <= 2.27 (bionic).
          MAX=$(objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Symbole glibc le plus haut : ${MAX:-aucun}"
          test "$(printf '%s\nGLIBC_2.27\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.27" \
            || { echo "ERREUR : le paquet exige ${MAX} > GLIBC_2.27"; exit 1; }
          # libstdc++ doit être STATIQUE : linuxdeploy blackliste libstdc++.so.6 et ne
          # l'embarquera jamais, donc un GLIBCXX dynamique (flags -static-libstdc++
          # retirés) laisserait la garde GLIBC_ ci-dessus au vert tout en rendant le
          # paquet inutilisable sur Mint 19 — le seul public que ce job existe pour servir.
          GXX=$(objdump -T "$BIN" | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | tail -1 || true)
          test -z "$GXX" || { echo "ERREUR : libstdc++ liée dynamiquement ($GXX)"; exit 1; }
          # GLFW doit être DANS le paquet (les cibles ne l'ont pas forcément)…
          find squashfs-root -name 'libglfw*' | grep -q . \
            || { echo "ERREUR : libglfw absente du paquet"; exit 1; }
          # …mais jamais libGL (règle AppImage : pilote graphique = hôte).
          if find squashfs-root -name 'libGL.so*' -o -name 'libOpenGL.so*' | grep -q .; then
            echo "ERREUR : libGL embarquée dans l'AppImage"; exit 1
          fi
          # Liste autorisée : EmuTOS + tos102uk/tos162uk (profils ST/STE).
          # Les TOS Atari ne sont attendus QUE si le paquet a été construit avec eux :
          # NEOST_PACKAGE_NO_ATARI_TOS=1 produit un paquet 100 % libre (EmuTOS seul), et
          # cette garde le refusait alors comme un paquet incomplet — le nettoyage
          # juridique aurait été bloqué par la CI. Cf. packaging/stage_free_data.sh.
          if [ "${NEOST_PACKAGE_NO_ATARI_TOS:-1}" != "1" ]; then
            for rom in tos102uk.img tos162uk.img; do
              test -s "squashfs-root/usr/roms/$rom" \
                || { echo "ERREUR : $rom absent du paquet"; exit 1; }
            done
          fi
          # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Aucun paquet
          # publié n'en contenait avant le 2026-08-19 — rien ne le vérifiait.
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "squashfs-root/usr/licenses/$lic" \
              || { echo "ERREUR : licence absente du paquet : $lic"; exit 1; }
          done
          STRAY=$(find squashfs-root/usr/roms -maxdepth 1 -name '*.img' \
                  ! -name 'etos*' ! -name 'tos102uk.img' ! -name 'tos162uk.img')
          test -z "$STRAY" || { echo "ERREUR : ROM non autorisée embarquée : $STRAY"; exit 1; }
          # …et rien d'autre que diskA.st et les TROIS démos de démonstration côté
          # disquettes : le dépôt contient des jeux sous copyright, la garde ROM
          # seule ne les aurait jamais vus. La liste est EXPLICITE — elle doit
          # rester d'accord avec packaging/stage_free_data.sh et le CMakeLists.
          STRAYD=$(find squashfs-root/usr/disks -type f ! -name 'diskA.st' \
                  ! -name 'cuddly_demos.msa' ! -name 'nocooper.msa' ! -name 'closure.msa')
          test -z "$STRAYD" || { echo "ERREUR : disquette non libre embarquée : $STRAYD"; exit 1; }
          # Polices : sans elles le GUI se replie en silence sur la police bitmap
          # d'ImGui et tous les pictogrammes deviennent des carrés vides (invisible
          # ici, le smoke étant headless — d'où cette garde structurelle).
          for f in DejaVuSans.ttf fa-solid-900.ttf; do
            test -s "squashfs-root/usr/fonts/$f" || { echo "ERREUR : police absente du paquet : $f"; exit 1; }
          done
          echo "OK : AppImage x86_64 valide (ET_EXEC, glibc <= 2.27)"

      # Smoke du PAQUET, pas du binaire seul : version annoncée, boot EmuTOS,
      # disquette LIVRÉE (issue #38) et HD GEMDOS sur chemin ABSOLU (issue #37).
      # Détail et raison d'être de chaque phase → tools/smoke_package.sh.
      # glibc rétro-compatible : le binaire 2.27 tourne sur le runner.
      - name: Smoke-launch du paquet (version, boot, disquette, HD GEMDOS)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: bash tools/smoke_package.sh squashfs-root/usr bin/neost-headless "$NEOST_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-linux-x86_64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # --------------------------------------------- Linux ARM64 générique ------
  # Bâti directement sur le runner ARM64 natif (gratuit en dépôt public) :
  # plancher glibc = image du runner (2.39) — pour les distros ARM récentes.
  # Les paquets Raspberry (jobs `raspberry` générique et `pi400` -mcpu) couvrent
  # Pi OS avec leur plancher 2.36.
  linux-arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Installer les dépendances (GLFW dynamique, embarqué ensuite par linuxdeploy)
        run: |
          # Dépôt Microsoft de l'image runner : inutile ici, et ses 403 font échouer l'update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -qq -o Acquire::Retries=3
          # ffmpeg : dépendance NON ÉVIDENTE du palier « full » — compare_screenshot.py
          # décode les références .png en passant par ffmpeg. Sans lui, les 5 étalons à
          # référence PNG (nocooper, nocooper_greetings, spec512 ×3) lèvent une
          # FileNotFoundError et la garde de validation tombe.
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libglfw3-dev libgl1-mesa-dev file ffmpeg

      - name: Build (Release) — neost + neost-headless
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: |
          # ⚠ -DNEOST_VERSION_STR est OBLIGATOIRE : ce job compile en direct (les
          # autres passent par build_in_bionic.sh / build_in_bookworm_arm64.sh /
          # package_macos.sh, qui le posent tous). Sans lui le binaire garde le
          # project(VERSION) de CMake (0.1.0) et la garde « --version | grep
          # $NEOST_VERSION » plus bas échoue à TOUS les coups — or `publish` a
          # besoin de ce job, donc aucune release ne pouvait sortir.
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DNEOST_VERSION_STR="${NEOST_VERSION}" \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j"$(nproc)"
          test -x build/neost   # le GUI DOIT être là (GLFW trouvé), pas juste le headless

      # Le SEUL filet de validation du projet (cf. CLAUDE.md : pas de tests unitaires,
      # tout passe par neost-headless). Palier **FULL** — et non « fast » : c'est le
      # palier P2 qui porte les comparaisons PIXEL (nocooper, spec512, scroll, overscan,
      # trace_odd). « fast » ne contient que des auto-tests de logique et des verdicts
      # série ; s'en contenter laissait publiable exactement la régression que cette
      # garde est censée arrêter. Tous les disques d'étalons et les références sont
      # suivis par git, donc « full » tourne sans rien télécharger (~2 min).
      - name: Suite de validation (palier full — inclut les étalons PIXEL)
        run: python3 tools/run_all.py --tier full

      - name: Empaqueter l'AppImage
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: packaging/linux/make_appimage.sh build

      - name: Vérifier l'AppImage (ET_EXEC, magic, arch, GLFW, contenu libre)
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage)
          # ET_EXEC via le runtime aarch64 épinglé (AppImageKit release 12) —
          # le `continuous` ARM est ET_DYN, rejeté par AppImageLauncher.
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type/ {print $3; exit}')
          echo "Type ELF du runtime : $TYPE"
          test "$TYPE" = "EXEC" || { echo "ERREUR : runtime $TYPE ≠ EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" || { echo "ERREUR : magic AppImage $MAGIC ≠ 414902"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/neost
          readelf -h "$BIN" | grep -q 'AArch64' || { echo "ERREUR : pas un binaire AArch64"; exit 1; }
          find squashfs-root -name 'libglfw*' | grep -q . \
            || { echo "ERREUR : libglfw absente du paquet"; exit 1; }
          if find squashfs-root -name 'libGL.so*' -o -name 'libOpenGL.so*' | grep -q .; then
            echo "ERREUR : libGL embarquée dans l'AppImage"; exit 1
          fi
          # Les TOS Atari ne sont attendus QUE si le paquet a été construit avec eux :
          # NEOST_PACKAGE_NO_ATARI_TOS=1 produit un paquet 100 % libre (EmuTOS seul), et
          # cette garde le refusait alors comme un paquet incomplet — le nettoyage
          # juridique aurait été bloqué par la CI. Cf. packaging/stage_free_data.sh.
          if [ "${NEOST_PACKAGE_NO_ATARI_TOS:-1}" != "1" ]; then
            for rom in tos102uk.img tos162uk.img; do
              test -s "squashfs-root/usr/roms/$rom" \
                || { echo "ERREUR : $rom absent du paquet"; exit 1; }
            done
          fi
          # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Aucun paquet
          # publié n'en contenait avant le 2026-08-19 — rien ne le vérifiait.
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "squashfs-root/usr/licenses/$lic" \
              || { echo "ERREUR : licence absente du paquet : $lic"; exit 1; }
          done
          STRAY=$(find squashfs-root/usr/roms -maxdepth 1 -name '*.img' \
                  ! -name 'etos*' ! -name 'tos102uk.img' ! -name 'tos162uk.img')
          test -z "$STRAY" || { echo "ERREUR : ROM non autorisée embarquée : $STRAY"; exit 1; }
          # …et rien d'autre que diskA.st et les TROIS démos de démonstration côté
          # disquettes : le dépôt contient des jeux sous copyright, la garde ROM
          # seule ne les aurait jamais vus. La liste est EXPLICITE — elle doit
          # rester d'accord avec packaging/stage_free_data.sh et le CMakeLists.
          STRAYD=$(find squashfs-root/usr/disks -type f ! -name 'diskA.st' \
                  ! -name 'cuddly_demos.msa' ! -name 'nocooper.msa' ! -name 'closure.msa')
          test -z "$STRAYD" || { echo "ERREUR : disquette non libre embarquée : $STRAYD"; exit 1; }
          # Polices : sans elles le GUI se replie en silence sur la police bitmap
          # d'ImGui et tous les pictogrammes deviennent des carrés vides (invisible
          # ici, le smoke étant headless — d'où cette garde structurelle).
          for f in DejaVuSans.ttf fa-solid-900.ttf; do
            test -s "squashfs-root/usr/fonts/$f" || { echo "ERREUR : police absente du paquet : $f"; exit 1; }
          done
          echo "OK : AppImage aarch64 générique valide (ET_EXEC)"

      # Smoke du PAQUET (cf. tools/smoke_package.sh) : version, boot EmuTOS,
      # disquette livrée (#38) et HD GEMDOS sur chemin absolu (#37).
      - name: Smoke-launch du paquet (version, boot, disquette, HD GEMDOS)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: bash tools/smoke_package.sh squashfs-root/usr bin/neost-headless "$NEOST_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-linux-aarch64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # ------------------------------------------------- Raspberry Pi (arm64) ----
  # Même schéma que le job `raspberry` de POM1 : runner ARM64 natif GitHub +
  # build DANS un conteneur debian:bookworm, car Raspberry Pi OS est Debian
  # bookworm et une AppImage n'embarque jamais la glibc — son plancher est
  # celui de l'image de build (2.36), pas du runner (2.39). Pas de conteneur
  # gelé en GHCR (contrairement au bionic POM1) : bookworm est une Debian
  # courante aux miroirs sains.
  raspberry:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build + AppImage dans un conteneur bookworm arm64
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: |
          docker run --rm -v "$PWD":/work -w /work -e NEOST_VERSION \
            debian:bookworm bash /work/packaging/linux/build_in_bookworm_arm64.sh

      - name: Vérifier l'AppImage (nom, arch, plancher glibc <= 2.36, contenu libre)
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage)
          echo "Paquet : $APP"
          # Le nom doit porter « raspberry » — le job publish aplatit tous les
          # artefacts dans un même dossier, une collision écraserait l'arm64
          # générique en silence.
          case "$APP" in
            *-raspberry-aarch64.AppImage) ;;
            *) echo "ERREUR : $APP n'est pas nommé -raspberry-aarch64.AppImage"; exit 1 ;;
          esac
          # ET_EXEC via le runtime aarch64 épinglé (AppImageKit release 12) —
          # le `continuous` ARM est ET_DYN, rejeté par AppImageLauncher.
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type/ {print $3; exit}')
          echo "Type ELF du runtime : $TYPE"
          test "$TYPE" = "EXEC" || { echo "ERREUR : runtime $TYPE ≠ EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" || { echo "ERREUR : magic AppImage $MAGIC ≠ 414902"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/neost
          readelf -h "$BIN" | grep -q AArch64 \
            || { echo "ERREUR : pas un binaire AArch64"; exit 1; }
          # Plancher glibc : le symbole GLIBC_x.y le plus haut exigé doit rester
          # <= 2.36 (bookworm / Pi OS), sinon le paquet ne démarre sur aucun Pi.
          MAX=$(objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Symbole glibc le plus haut : ${MAX:-aucun}"
          test "$(printf '%s\nGLIBC_2.36\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.36" \
            || { echo "ERREUR : le paquet exige ${MAX} > GLIBC_2.36 — Pi OS ne le lancera pas"; exit 1; }
          find squashfs-root -name 'libglfw*' | grep -q . \
            || { echo "ERREUR : libglfw absente du paquet"; exit 1; }
          if find squashfs-root -name 'libGL.so*' -o -name 'libOpenGL.so*' | grep -q .; then
            echo "ERREUR : libGL embarquée dans l'AppImage"; exit 1
          fi
          # Les TOS Atari ne sont attendus QUE si le paquet a été construit avec eux :
          # NEOST_PACKAGE_NO_ATARI_TOS=1 produit un paquet 100 % libre (EmuTOS seul), et
          # cette garde le refusait alors comme un paquet incomplet — le nettoyage
          # juridique aurait été bloqué par la CI. Cf. packaging/stage_free_data.sh.
          if [ "${NEOST_PACKAGE_NO_ATARI_TOS:-1}" != "1" ]; then
            for rom in tos102uk.img tos162uk.img; do
              test -s "squashfs-root/usr/roms/$rom" \
                || { echo "ERREUR : $rom absent du paquet"; exit 1; }
            done
          fi
          # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Aucun paquet
          # publié n'en contenait avant le 2026-08-19 — rien ne le vérifiait.
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "squashfs-root/usr/licenses/$lic" \
              || { echo "ERREUR : licence absente du paquet : $lic"; exit 1; }
          done
          STRAY=$(find squashfs-root/usr/roms -maxdepth 1 -name '*.img' \
                  ! -name 'etos*' ! -name 'tos102uk.img' ! -name 'tos162uk.img')
          test -z "$STRAY" || { echo "ERREUR : ROM non autorisée embarquée : $STRAY"; exit 1; }
          # …et rien d'autre que diskA.st et les TROIS démos de démonstration côté
          # disquettes : le dépôt contient des jeux sous copyright, la garde ROM
          # seule ne les aurait jamais vus. La liste est EXPLICITE — elle doit
          # rester d'accord avec packaging/stage_free_data.sh et le CMakeLists.
          STRAYD=$(find squashfs-root/usr/disks -type f ! -name 'diskA.st' \
                  ! -name 'cuddly_demos.msa' ! -name 'nocooper.msa' ! -name 'closure.msa')
          test -z "$STRAYD" || { echo "ERREUR : disquette non libre embarquée : $STRAYD"; exit 1; }
          # Polices : sans elles le GUI se replie en silence sur la police bitmap
          # d'ImGui et tous les pictogrammes deviennent des carrés vides (invisible
          # ici, le smoke étant headless — d'où cette garde structurelle).
          for f in DejaVuSans.ttf fa-solid-900.ttf; do
            test -s "squashfs-root/usr/fonts/$f" || { echo "ERREUR : police absente du paquet : $f"; exit 1; }
          done
          echo "OK : AppImage Raspberry Pi valide (glibc <= 2.36)"

      # Smoke du PAQUET (cf. tools/smoke_package.sh) : version, boot EmuTOS,
      # disquette livrée (#38) et HD GEMDOS sur chemin absolu (#37).
      # La glibc est rétro-compatible : le binaire bâti en 2.36 tourne sur le
      # runner 2.39.
      - name: Smoke-launch du paquet (version, boot, disquette, HD GEMDOS)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: bash tools/smoke_package.sh squashfs-root/usr bin/neost-headless "$NEOST_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-raspberry-arm64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # ------------------------------------------- Raspberry Pi 4 / Pi 400 -------
  # Jumeau TAILLÉ POUR UN CŒUR du job `raspberry` ci-dessus, et c'est toute la
  # différence : `raspberry` est aarch64 GÉNÉRIQUE (aucun -mcpu) parce qu'il doit
  # tourner du Pi 3 au Pi 5 ; celui-ci compile en -mcpu=cortex-a72 (Pi 4 / Pi 400)
  # et ne démarrera PAS sur un cœur plus ancien. Les deux sont publiés : le nom
  # dit lequel on prend. Même script que la borne (packaging/raspberry/), déjà
  # éprouvé par pi-borne.yml — d'où le PGO + LTO et les 90 minutes (deux
  # compilations complètes + le parcours d'entraînement). Cf. docs/PERFORMANCE.md § 5.
  pi400:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build -mcpu=cortex-a72 dans un conteneur bookworm arm64
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
          NEOST_MCPU: cortex-a72
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e NEOST_VERSION -e NEOST_MCPU \
            debian:bookworm bash /work/packaging/raspberry/build_in_bookworm_pi.sh

      - name: Vérifier l'AppImage (nom, arch, plancher glibc <= 2.36, contenu libre)
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage)
          echo "Paquet : $APP"
          # Le nom doit porter « pi400 » : le job publish aplatit tous les artefacts
          # dans un même dossier, et une collision écraserait EN SILENCE l'AppImage
          # raspberry générique — c'est-à-dire remplacerait le paquet Pi 3→Pi 5 par
          # un binaire qui ne démarre que sur Cortex-A72.
          case "$APP" in
            *-pi400-aarch64.AppImage) ;;
            *) echo "ERREUR : $APP n'est pas nommé -pi400-aarch64.AppImage"; exit 1 ;;
          esac
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type/ {print $3; exit}')
          echo "Type ELF du runtime : $TYPE"
          test "$TYPE" = "EXEC" || { echo "ERREUR : runtime $TYPE ≠ EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" || { echo "ERREUR : magic AppImage $MAGIC ≠ 414902"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/neost
          readelf -h "$BIN" | grep -q AArch64 \
            || { echo "ERREUR : pas un binaire AArch64"; exit 1; }
          MAX=$(objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Symbole glibc le plus haut : ${MAX:-aucun}"
          test "$(printf '%s\nGLIBC_2.36\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.36" \
            || { echo "ERREUR : le paquet exige ${MAX} > GLIBC_2.36 — Pi OS ne le lancera pas"; exit 1; }
          find squashfs-root -name 'libglfw*' | grep -q . \
            || { echo "ERREUR : libglfw absente du paquet"; exit 1; }
          if find squashfs-root -name 'libGL.so*' -o -name 'libOpenGL.so*' | grep -q .; then
            echo "ERREUR : libGL embarquée dans l'AppImage"; exit 1
          fi
          # Les TOS Atari ne sont attendus QUE si le paquet a été construit avec eux :
          # NEOST_PACKAGE_NO_ATARI_TOS=1 produit un paquet 100 % libre (EmuTOS seul), et
          # cette garde le refusait alors comme un paquet incomplet — le nettoyage
          # juridique aurait été bloqué par la CI. Cf. packaging/stage_free_data.sh.
          if [ "${NEOST_PACKAGE_NO_ATARI_TOS:-1}" != "1" ]; then
            for rom in tos102uk.img tos162uk.img; do
              test -s "squashfs-root/usr/roms/$rom" \
                || { echo "ERREUR : $rom absent du paquet"; exit 1; }
            done
          fi
          # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Aucun paquet
          # publié n'en contenait avant le 2026-08-19 — rien ne le vérifiait.
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "squashfs-root/usr/licenses/$lic" \
              || { echo "ERREUR : licence absente du paquet : $lic"; exit 1; }
          done
          STRAY=$(find squashfs-root/usr/roms -maxdepth 1 -name '*.img' \
                  ! -name 'etos*' ! -name 'tos102uk.img' ! -name 'tos162uk.img')
          test -z "$STRAY" || { echo "ERREUR : ROM non autorisée embarquée : $STRAY"; exit 1; }
          STRAYD=$(find squashfs-root/usr/disks -type f ! -name 'diskA.st' \
                  ! -name 'cuddly_demos.msa' ! -name 'nocooper.msa' ! -name 'closure.msa')
          test -z "$STRAYD" || { echo "ERREUR : disquette non libre embarquée : $STRAYD"; exit 1; }
          for f in DejaVuSans.ttf fa-solid-900.ttf; do
            test -s "squashfs-root/usr/fonts/$f" || { echo "ERREUR : police absente du paquet : $f"; exit 1; }
          done
          echo "OK : AppImage Pi 4 / Pi 400 valide (-mcpu=cortex-a72, glibc <= 2.36)"

      # Smoke du PAQUET (cf. tools/smoke_package.sh) : version, boot EmuTOS,
      # disquette livrée (#38) et HD GEMDOS sur chemin absolu (#37).
      # Le runner ubuntu-24.04-arm est un Neoverse : il EXÉCUTE du cortex-a72
      # (même ISA ARMv8-A, -mcpu ne fait qu'ordonnancer et choisir des extensions
      # déjà présentes). Le smoke est donc réel, pas symbolique.
      - name: Smoke-launch du paquet (version, boot, disquette, HD GEMDOS)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: bash tools/smoke_package.sh squashfs-root/usr bin/neost-headless "$NEOST_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-pi400-arm64-AppImage
          path: dist/*-pi400-aarch64.AppImage
          if-no-files-found: error

  # ----------------------------------------------------------------- macOS --
  # UN .dmg Universal 2 (arm64 + x86_64) — natif sur Apple Silicon ET Intel,
  # aucun Rosetta. Le runner arm64 cross-compile la tranche x86_64 nativement.
  macos:
    needs: version
    runs-on: macos-15          # Apple Silicon natif
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Empaqueter .app + .dmg Universal 2 (GLFW statique depuis les sources)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: packaging/macos/package_macos.sh

      - name: Vérifier le .app (Universal 2, autonome, contenu libre)
        run: |
          set -euo pipefail
          BIN=dist/NeoST.app/Contents/MacOS/neost
          otool -L "$BIN"
          # Universal 2 : les DEUX tranches, sinon la moitié du parc reçoit un
          # paquet qui ne s'exécute pas du tout.
          for f in "$BIN" dist/NeoST.app/Contents/MacOS/neost-headless; do
            lipo -info "$f"
            for a in arm64 x86_64; do
              lipo -info "$f" | grep -qw "$a" \
                || { echo "ERREUR : $f n'a pas la tranche $a"; exit 1; }
            done
          done
          # Le garde anti-chemin-brew a déjà tourné dans le packager ; re-vérifier ici.
          LEAKED=$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' \
                   | grep -E '^(/usr/local|/opt/homebrew|/opt/local)' || true)
          test -z "$LEAKED" || { echo "ERREUR : dylib hors bundle : $LEAKED"; exit 1; }
          # Les TOS Atari ne sont attendus QUE si le paquet a été construit avec eux :
          # NEOST_PACKAGE_NO_ATARI_TOS=1 produit un paquet 100 % libre (EmuTOS seul), et
          # cette garde le refusait alors comme un paquet incomplet — le nettoyage
          # juridique aurait été bloqué par la CI. Cf. packaging/stage_free_data.sh.
          if [ "${NEOST_PACKAGE_NO_ATARI_TOS:-1}" != "1" ]; then
            for rom in tos102uk.img tos162uk.img; do
              test -s "dist/NeoST.app/Contents/roms/$rom" \
                || { echo "ERREUR : $rom absent du paquet"; exit 1; }
            done
          fi
          # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Aucun paquet
          # publié n'en contenait avant le 2026-08-19 — rien ne le vérifiait.
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "dist/NeoST.app/Contents/licenses/$lic" \
              || { echo "ERREUR : licence absente du paquet : $lic"; exit 1; }
          done
          STRAY=$(find dist/NeoST.app/Contents/roms -maxdepth 1 -name '*.img' \
                  ! -name 'etos*' ! -name 'tos102uk.img' ! -name 'tos162uk.img')
          test -z "$STRAY" || { echo "ERREUR : ROM non autorisée embarquée : $STRAY"; exit 1; }
          STRAYD=$(find dist/NeoST.app/Contents/disks -type f ! -name 'diskA.st' \
                  ! -name 'cuddly_demos.msa' ! -name 'nocooper.msa' ! -name 'closure.msa')
          test -z "$STRAYD" || { echo "ERREUR : disquette non libre embarquée : $STRAYD"; exit 1; }
          for f in DejaVuSans.ttf fa-solid-900.ttf; do
            test -s "dist/NeoST.app/Contents/fonts/$f" || { echo "ERREUR : police absente du paquet : $f"; exit 1; }
          done
          # Plancher système : sans CMAKE_OSX_DEPLOYMENT_TARGET, clang estampille la
          # version de l'OS du runner (15.x) et le .dmg refuse de démarrer sur
          # Ventura/Sonoma comme sur tout Mac Intel d'avant 2019.
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/{print $2; exit}')
          echo "Plancher macOS : ${MINOS:-inconnu}"
          test -n "$MINOS" && test "$(printf '%s\n11.0\n' "$MINOS" | sort -V | head -1)" = "11.0" \
            || { echo "ERREUR : le paquet exige macOS ${MINOS} > 11.0"; exit 1; }
          echo "OK : .app Universal 2 autonome"

      # Smoke du PAQUET (cf. tools/smoke_package.sh) : version, boot EmuTOS,
      # disquette livrée (#38) et HD GEMDOS sur chemin absolu (#37). Le script
      # nettoie ses captures et son dossier de test — rien ne reste dans le .app.
      # Exerce la tranche arm64 (l'arch du runner) ; la tranche x86_64 est
      # vérifiée structurellement par le garde lipo ci-dessus — les images macOS
      # arm64 de GitHub n'ont pas Rosetta, on ne peut pas l'exécuter.
      - name: Smoke-launch du paquet (version, boot, disquette, HD GEMDOS)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: bash tools/smoke_package.sh dist/NeoST.app/Contents MacOS/neost-headless "$NEOST_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-macOS-universal2-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ WASM --
  # Même liste autorisée que les paquets bureau (NEOST_WEB_FREE_ONLY=ON : EmuTOS
  # SEUL + drivesound + diskA depuis la purge du 2026-08-30), jamais le reste de
  # roms/ ni disks/. La liste elle-même vit dans le CMakeLists, pas ici.
  wasm:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Installer Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WASM (contenu libre uniquement)
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release -DNEOST_WEB_FREE_ONLY=ON
          cmake --build build-web -j"$(nproc)" --target neost-web

      - name: Vérifier le bundle (fichiers présents, taille bornée)
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.data; do
            test -s "wasm/$f" || { echo "ERREUR : wasm/$f absent ou vide"; exit 1; }
          done
          # Contenu libre → le bundle doit rester léger. Le mode « tout embarqué »
          # pèse ~73 Mo ; une dérive au-delà de 40 Mo signale une fuite de contenu.
          TOTAL=$(du -cb wasm/index.* | tail -1 | cut -f1)
          echo "Taille du bundle : $TOTAL octets"
          test "$TOTAL" -lt 40000000 \
            || { echo "ERREUR : bundle > 40 Mo — du contenu non libre a fui dedans ?"; exit 1; }

      # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Les six autres
      # jobs de paquet le gardent depuis le 2026-08-19 — le bundle web avait été
      # OUBLIÉ, et il est distribué DEUX fois (le .zip de la release et le site
      # Pages). Constaté le 2026-09-01 en ouvrant le paquet 0.6 publié : quatre
      # fichiers, aucune licence (chantier A12).
      - name: Poser et vérifier les licences du bundle
        run: |
          set -euo pipefail
          mkdir -p wasm/licenses
          cp LICENSE wasm/licenses/GPL-3.0.txt
          cp packaging/licenses/GPL-2.0.txt wasm/licenses/
          cp packaging/licenses/THIRD-PARTY.txt wasm/licenses/
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "wasm/licenses/$lic" \
              || { echo "ERREUR : licence absente du bundle web : $lic"; exit 1; }
          done

      - name: Zipper le bundle
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: |
          mkdir -p dist
          (cd wasm && zip -9 -r "../dist/NeoST-$NEOST_VERSION-web-wasm.zip" index.html index.js index.wasm index.data licenses)

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-web-wasm
          path: dist/*.zip
          if-no-files-found: error

      # --- Pages est servi par la CI, pas par le dépôt -----------------------
      # Le bundle n'est plus commité : on le dépose en ARTEFACT Pages et un job
      # dédié le déploie. Deux raisons de ne pas revenir au dossier commité :
      #   · en build_type=legacy, Pages publiait le DÉPÔT ENTIER — ROM comprises ;
      #   · la CI recommittait le bundle à chaque push, d'où un commit de bot
      #     systématique sur main (et des rebases à répétition pour le mainteneur).
      # Un `cmake --build build-web --target neost-web` local régénère wasm/ pour
      # qui veut la démo hors ligne ; le dossier est désormais gitignoré.
      - name: Déposer le bundle comme artefact Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm

  # ------------------------------------------------------------- Pages -------
  # Déploiement de la démo en ligne. L'artefact vient du job `wasm` ci-dessus :
  # une seule construction Emscripten par push, pas deux.
  pages:
    needs: wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write            # publier le déploiement
      id-token: write         # OIDC exigé par deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------ Windows x86_64 -----
  # MSYS2/MINGW64 et non MSVC : le code est écrit pour GCC/Clang (options -W…,
  # C++20 pour Moira) et se compile ainsi tel quel, sans porter la chaîne de
  # dépendances vers vcpkg. Le runner windows-latest EXÉCUTE le binaire produit :
  # le smoke-launch ci-dessous est donc un vrai lancement Windows, pas un
  # contrôle symbolique. Tout est lié en STATIQUE — cf. packaging/windows/
  # build_mingw.sh, qui refuse le paquet s'il importe une DLL non système.
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            zip
            unzip
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            glfw:p
            python:p

      - name: Build + zip (MinGW64, tout statique)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: packaging/windows/build_mingw.sh

      - name: Vérifier le zip (contenu libre, pas de DLL parasite)
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*-windows-x86_64.zip)
          echo "Paquet : $ZIP"
          unzip -q "$ZIP" -d _check
          ROOT=$(ls -d _check/*/)
          test -s "${ROOT}neost.exe"          || { echo "ERREUR : neost.exe absent"; exit 1; }
          test -s "${ROOT}neost-headless.exe" || { echo "ERREUR : neost-headless.exe absent"; exit 1; }
          # Aucune DLL ne doit être livrée : le build est statique. Une DLL ici
          # signifierait que le -static a silencieusement lâché.
          if find "$ROOT" -name '*.dll' | grep -q .; then
            echo "ERREUR : DLL présente dans le zip — le lien statique a lâché"
            find "$ROOT" -name '*.dll'; exit 1
          fi
          # Mêmes gardes de contenu que les AppImage : liste autorisée seulement.
          # Les TOS Atari ne sont attendus QUE si le paquet a été construit avec eux :
          # NEOST_PACKAGE_NO_ATARI_TOS=1 produit un paquet 100 % libre (EmuTOS seul), et
          # cette garde le refusait alors comme un paquet incomplet — le nettoyage
          # juridique aurait été bloqué par la CI. Cf. packaging/stage_free_data.sh.
          if [ "${NEOST_PACKAGE_NO_ATARI_TOS:-1}" != "1" ]; then
            for rom in tos102uk.img tos162uk.img; do
              test -s "${ROOT}roms/$rom" || { echo "ERREUR : $rom absent du paquet"; exit 1; }
            done
          fi
          # Licences : la GPL exige que son texte ACCOMPAGNE le binaire. Aucun paquet
          # publié n'en contenait avant le 2026-08-19 — rien ne le vérifiait.
          for lic in GPL-3.0.txt GPL-2.0.txt THIRD-PARTY.txt; do
            test -s "${ROOT}licenses/$lic" \
              || { echo "ERREUR : licence absente du paquet : $lic"; exit 1; }
          done
          STRAY=$(find "${ROOT}roms" -maxdepth 1 -name '*.img' \
                  ! -name 'etos*' ! -name 'tos102uk.img' ! -name 'tos162uk.img')
          test -z "$STRAY" || { echo "ERREUR : ROM non autorisée embarquée : $STRAY"; exit 1; }
          STRAYD=$(find "${ROOT}disks" -type f ! -name 'diskA.st' \
                  ! -name 'cuddly_demos.msa' ! -name 'nocooper.msa' ! -name 'closure.msa')
          test -z "$STRAYD" || { echo "ERREUR : disquette non libre embarquée : $STRAYD"; exit 1; }
          for f in DejaVuSans.ttf fa-solid-900.ttf; do
            test -s "${ROOT}fonts/$f" || { echo "ERREUR : police absente du paquet : $f"; exit 1; }
          done
          echo "OK : zip Windows valide (statique, contenu libre)"

      # Smoke du PAQUET (cf. tools/smoke_package.sh) : version, boot EmuTOS,
      # disquette livrée (#38) et HD GEMDOS sur chemin absolu (#37). C'EST ICI que
      # le second comptait : le montage GEMDOS reçoit un chemin Windows natif
      # (cygpath -w), exactement la forme « D:\a\… » qui était prise pour relative
      # et rendait le lecteur C: inutilisable sur tous les paquets 0.5.x.
      - name: Smoke-launch du paquet (version, boot, disquette, HD GEMDOS)
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: bash tools/smoke_package.sh "$(ls -d _check/*/)" ./neost-headless.exe "$NEOST_VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-windows-x86_64
          path: dist/*-windows-x86_64.zip
          if-no-files-found: error

  # ----------------------------------------------- attacher à la Release ----
  # ------------------------------------------------------ Android arm64 ------
  # APK arm64-v8a signé avec la clé de DEBUG d'Android : installable directement
  # (adb install / « sources inconnues »), mais PAS publiable sur un store — le
  # projet n'a pas de clé de signature et n'en aura pas dans le dépôt (cf.
  # packaging/android/README.md § Signature). SDL2 est récupéré par
  # fetch_sdl.sh (vendorisé non commité, comme Hatari) ; les assets sont
  # STRICTEMENT la liste libre (stage_assets.sh, garde-fou intégré) — la
  # politique des stores est plus stricte que celle des paquets de bureau, donc
  # PAS de tos102uk/tos162uk ici, contrairement aux AppImage/DMG.
  #
  # Le runner ubuntu-latest livre un SDK Android préinstallé ($ANDROID_HOME) ;
  # on n'installe que les VERSIONS ÉPINGLÉES du projet (NDK 27, CMake 3.22,
  # API 34) — celles du README, validées en local. JDK 17 COMPLET via
  # setup-java : un JRE headless n'a pas `jlink`, dont AGP a besoin pour ses
  # « system modules », et son message d'erreur ne dit pas qu'il manque un
  # paquet (piège documenté dans packaging/android/README.md).
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive     # extern/imgui : le menu Android en dépend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin     # JDK COMPLET (jlink inclus), pas un JRE
          java-version: '17'

      - name: Installer les composants SDK épinglés (NDK 27, CMake 3.22, API 34)
        run: |
          set -eu
          # ubuntu-latest préinstalle le SDK mais n'expose PAS sdkmanager dans le
          # PATH (vérifié : « command not found » au premier run) → chemin complet,
          # avec repli sur le PATH pour un éventuel runner qui l'y mettrait.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null 2>&1 && SDKM=sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          # REPRISE (2026-09-02). `sdkmanager` télécharge PUIS dézippe, et une archive
          # tronquée est FATALE : « Error on ZipFile unknown archive » sur le NDK a fait
          # échouer ce job le 2026-09-02 — et `publish` avec lui, puisqu'il dépend des
          # huit paquets. Le job a repassé tel quel au push suivant : c'était bien un aléa
          # réseau, pas une régression. C'est la MÊME leçon que l'`apt-get install` sans
          # `update` de la 0.6.1 (cf. CHANGELOG) : une seule étape réseau sans filet suffit
          # à bloquer une release. On réessaie donc, en PURGEANT l'installation partielle
          # entre deux tentatives — sans quoi une extraction à moitié faite peut être
          # reprise telle quelle et échouer à l'identique.
          ok=0
          for try in 1 2 3; do
            if "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" \
                       "ndk;27.2.12479018" "cmake;3.22.1"; then ok=1; break; fi
            echo "::warning::sdkmanager a échoué (tentative $try/3) — purge puis nouvelle tentative"
            rm -rf "$ANDROID_HOME/ndk/27.2.12479018" || true
            sleep $(( try * 15 ))
          done
          [ "$ok" = 1 ] || { echo "::error::sdkmanager a échoué 3 fois de suite — ce n'est plus un aléa"; exit 1; }

      - name: Récupérer SDL2 (couche plateforme, vendorisée non commitée)
        run: ./packaging/android/fetch_sdl.sh

      - name: Build APK (debug = signé clé de debug, installable)
        run: ./packaging/android/build_apk.sh debug

      # Pas d'appareil ni de KVM sur les runners : vérification STATIQUE, la
      # même qui a validé le premier APK en local — bibliothèques natives et
      # assets (déjà garantis par build_apk.sh), plus le manifeste (paquet,
      # activité lançable, arm64-v8a). Le CŒUR arm64, lui, est validé par
      # ailleurs : image et son identiques au bit près au x86-64 sous
      # qemu-aarch64 (packaging/android/README.md § Vérifier sans appareil).
      - name: Vérifier le manifeste de l'APK
        run: |
          set -eu
          APK=packaging/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='net.gistlabs.neost" badging.txt
          grep -q "native-code: 'arm64-v8a'" badging.txt
          grep -q "launchable-activity: name='net.gistlabs.neost.NeoSTActivity'" badging.txt

      - name: Renommer pour la release
        env:
          NEOST_VERSION: ${{ needs.version.outputs.neost_version }}
        run: |
          mkdir -p dist
          cp packaging/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/NeoST-$NEOST_VERSION-android-arm64-debug.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: NeoST-android-arm64
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [linux-bionic, linux-arm64, raspberry, pi400, macos, wasm, windows, android]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Attacher les 8 paquets + sommes SHA-256 à la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # Pas de checkout ici : GH_REPO évite le « not a git repository »
          # que POM1 a payé d'une release fantôme (cf. release.yml POM1).
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p staging
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \
                                     -o -name '*.apk' \) \
               -exec cp -v {} staging/ \;
          cd staging
          COUNT=$(ls | wc -l)
          test "$COUNT" -eq 8 || { echo "ERREUR : $COUNT paquet(s) au lieu de 8"; exit 1; }
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" * --clobber
          else
              gh release create "$TAG" * --generate-notes --title "NeoST $TAG"
          fi
